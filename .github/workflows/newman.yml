name: API regression (Newman)

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "scripts/**"
      - ".github/workflows/newman.yml"
  # Weekly regression: Mondays 07:00 UTC, only if Jira has tickets ready for API testing.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      jira_gate:
        description: "Check Jira first (same logic as the weekly scheduled run)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Not a secret: kept in plain text so ticket links in the run summary work.
  JIRA_BASE_URL: https://e-chat.atlassian.net
  # Status "on STAGE" is matched by id (10225) so a rename does not break the query.
  JIRA_JQL: project = CHAT AND labels = "api-testing" AND status = 10225 ORDER BY key

# The tests update one shared test profile, so runs must not overlap.
concurrency:
  group: api-regression
  cancel-in-progress: false

jobs:
  # Runs only for the weekly schedule and for a manual run with jira_gate = true.
  # Push and a plain manual run skip it and go straight to Newman.
  jira-gate:
    name: Jira gate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.jira_gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_regression: ${{ steps.search.outputs.run_regression }}
    steps:
      - name: Check Jira secrets
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          missing=""
          [ -n "$JIRA_EMAIL" ] || missing="$missing JIRA_EMAIL"
          [ -n "$JIRA_API_TOKEN" ] || missing="$missing JIRA_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Jira gate::Missing repository secrets:$missing. The gated run cannot decide whether to run the regression."
            {
              echo "## Jira gate: failed"
              echo "Missing repository secrets:**$missing**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Jira can answer anonymously (200 and 0 tickets), so check that we are really logged in.
      - name: Verify Jira login
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/myself.json" -w '%{http_code}' \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' \
            "$JIRA_BASE_URL/rest/api/3/myself")
          account_id=$(jq -r '.accountId // empty' "$RUNNER_TEMP/myself.json" 2>/dev/null || true)
          account_type=$(jq -r '.accountType // empty' "$RUNNER_TEMP/myself.json" 2>/dev/null || true)
          active=$(jq -r '.active // empty' "$RUNNER_TEMP/myself.json" 2>/dev/null || true)
          rm -f "$RUNNER_TEMP/myself.json"
          if [ "$status" != "200" ] || [ -z "$account_id" ] || [ "$account_type" != "atlassian" ] || [ "$active" != "true" ]; then
            echo "::error title=Jira gate::Jira login failed (HTTP $status, accountType='${account_type:-none}'). Check JIRA_EMAIL and JIRA_API_TOKEN."
            {
              echo "## Jira gate: failed"
              echo "Not authenticated in Jira (HTTP $status). Check \`JIRA_EMAIL\` and \`JIRA_API_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Jira login OK (accountType=$account_type)"

      - name: Search tickets
        id: search
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          keys_file="$RUNNER_TEMP/keys.txt"
          : > "$keys_file"
          next=""
          while :; do
            body=$(jq -n --arg jql "$JIRA_JQL" --arg next "$next" \
              '{jql: $jql, fields: ["key"], maxResults: 100}
               + (if $next == "" then {} else {nextPageToken: $next} end)')
            status=$(curl -sS -o "$RUNNER_TEMP/search.json" -w '%{http_code}' \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -X POST "$JIRA_BASE_URL/rest/api/3/search/jql" -d "$body")
            if [ "$status" != "200" ]; then
              msg=$(jq -r '(.errorMessages // []) | join("; ")' "$RUNNER_TEMP/search.json" 2>/dev/null || true)
              echo "::error title=Jira gate::Jira search failed (HTTP $status) $msg"
              exit 1
            fi
            jq -r '.issues[].key' "$RUNNER_TEMP/search.json" >> "$keys_file"
            next=$(jq -r '.nextPageToken // empty' "$RUNNER_TEMP/search.json")
            [ -n "$next" ] || break
          done
          rm -f "$RUNNER_TEMP/search.json"

          count=$(grep -c . "$keys_file" || true)
          {
            echo "## Jira gate"
            echo "JQL: \`$JIRA_JQL\`"
            echo
            if [ "$count" -gt 0 ]; then
              echo "Found **$count** ticket(s) — running the regression:"
              echo
              # Keys with links only: the repository is public, ticket titles are internal.
              while read -r key; do echo "- [$key]($JIRA_BASE_URL/browse/$key)"; done < "$keys_file"
            else
              echo "No tickets found — the regression is **skipped** for this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Found $count ticket(s): $(paste -sd ' ' "$keys_file")"
          if [ "$count" -gt 0 ]; then
            echo "run_regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_regression=false" >> "$GITHUB_OUTPUT"
          fi

  newman:
    name: Newman run
    needs: jira-gate
    # Gate skipped (push / plain manual run) -> run. Gate passed with tickets -> run.
    # Gate failed or found nothing -> do not run.
    if: >-
      !cancelled() && (
        needs.jira-gate.result == 'skipped'
        || (needs.jira-gate.result == 'success' && needs.jira-gate.outputs.run_regression == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      newman_ran: ${{ steps.newman_status.outputs.ran }}
      has_html_report: ${{ steps.pages_site.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Newman
        run: |
          npm install -g newman@6 newman-reporter-htmlextra@1
          newman --version

      - name: Log in and build environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          set -euo pipefail
          for v in BASE_URL TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          base_url="${BASE_URL%/}"

          body=$(jq -n --arg e "$TEST_USER_EMAIL" --arg p "$TEST_USER_PASSWORD" \
            '{email: $e, password: $p, lang: "en"}')
          status=$(curl -sS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -X POST "$base_url/v1/auth/login" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "$body")
          token=$(jq -r '.data.access_token // empty' "$RUNNER_TEMP/login.json" 2>/dev/null || true)
          rm -f "$RUNNER_TEMP/login.json"
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          if [ "$status" != "200" ] || [ -z "$token" ]; then
            echo "::error::Login failed: HTTP $status"
            exit 1
          fi
          printf '%s' "$token" > "$RUNNER_TEMP/token"

          # Phone must match ^\+\d+$ and be unique, so generate it per run.
          phone="+38099$(shuf -i 1000000-9999999 -n 1)"

          # test_email must stay the test user's own email (unique field, used for login).
          jq -n \
            --arg base_url "$base_url" \
            --arg token "$token" \
            --arg email "$TEST_USER_EMAIL" \
            --arg phone "$phone" \
            '{
              name: "ci",
              values: [
                {key: "base_url",        value: $base_url,              enabled: true},
                {key: "token",           value: $token,                 enabled: true},
                {key: "invalid_token",   value: "invalid.ci.token",     enabled: true},
                {key: "test_first_name", value: "Regression",           enabled: true},
                {key: "test_last_name",  value: "Bot",                  enabled: true},
                {key: "test_phone",      value: $phone,                 enabled: true},
                {key: "test_email",      value: $email,                 enabled: true},
                {key: "test_lang",       value: "en",                   enabled: true}
              ]
            }' > "$RUNNER_TEMP/env.json"

      - name: Run Newman
        id: newman
        run: |
          mkdir -p results reports
          newman run collections/account-api-collection.json \
            -e "$RUNNER_TEMP/env.json" \
            -r cli,json,htmlextra \
            --reporter-json-export results/newman-report.json \
            --reporter-htmlextra-export reports/index.html \
            --reporter-htmlextra-title "Account API regression" \
            --reporter-htmlextra-browserTitle "Account API regression" \
            --reporter-htmlextra-skipHeaders "Authorization" \
            --reporter-htmlextra-skipEnvironmentVars \
            --reporter-htmlextra-skipGlobalVars

      # "Ran" = Newman actually executed (passed or with failed assertions), not skipped after a failed login.
      - name: Record Newman status
        id: newman_status
        if: always() && (steps.newman.outcome == 'success' || steps.newman.outcome == 'failure')
        run: echo "ran=true" >> "$GITHUB_OUTPUT"

      # The repo and its Pages site are public: strip the token, Authorization headers,
      # API host and test-user email from the reports before they are uploaded.
      - name: Sanitize reports
        id: sanitize
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        run: |
          node scripts/sanitize-report.js "$RUNNER_TEMP/token" \
            results/newman-report.json reports/index.html

      - name: Upload JSON report
        if: always() && hashFiles('results/newman-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: results/newman-report.json
          retention-days: 7

      - name: Upload HTML report
        if: always() && hashFiles('reports/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-report
          path: reports/index.html
          retention-days: 7

      # Published even when assertions fail, but only from main and only after sanitizing succeeded.
      - name: Prepare Pages site
        id: pages_site
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.newman_status.outputs.ran == 'true'
          && steps.sanitize.outcome == 'success'
          && hashFiles('reports/index.html') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp reports/index.html "$RUNNER_TEMP/site/index.html"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: always() && steps.pages_site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/token" "$RUNNER_TEMP/env.json"

  publish-report:
    name: Publish HTML report to GitHub Pages
    needs: newman
    # Only when Newman really ran (also with failed assertions) and a sanitized report exists.
    # Not when Newman was skipped by the Jira gate or stopped before the run (e.g. API login failed).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.newman.result != 'skipped'
      && needs.newman.outputs.newman_ran == 'true'
      && needs.newman.outputs.has_html_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
