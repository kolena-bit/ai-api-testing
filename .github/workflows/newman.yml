name: API regression (Newman)

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "scripts/**"
      - ".github/workflows/newman.yml"
  workflow_dispatch:

permissions:
  contents: read

# The tests update one shared test profile, so runs must not overlap.
concurrency:
  group: api-regression
  cancel-in-progress: false

jobs:
  newman:
    name: Newman run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_html_report: ${{ steps.pages_site.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Newman
        run: |
          npm install -g newman@6 newman-reporter-htmlextra@1
          newman --version

      - name: Log in and build environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          set -euo pipefail
          for v in BASE_URL TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          base_url="${BASE_URL%/}"

          body=$(jq -n --arg e "$TEST_USER_EMAIL" --arg p "$TEST_USER_PASSWORD" \
            '{email: $e, password: $p, lang: "en"}')
          status=$(curl -sS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -X POST "$base_url/v1/auth/login" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "$body")
          token=$(jq -r '.data.access_token // empty' "$RUNNER_TEMP/login.json" 2>/dev/null || true)
          rm -f "$RUNNER_TEMP/login.json"
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          if [ "$status" != "200" ] || [ -z "$token" ]; then
            echo "::error::Login failed: HTTP $status"
            exit 1
          fi
          printf '%s' "$token" > "$RUNNER_TEMP/token"

          # Phone must match ^\+\d+$ and be unique, so generate it per run.
          phone="+38099$(shuf -i 1000000-9999999 -n 1)"

          # test_email must stay the test user's own email (unique field, used for login).
          jq -n \
            --arg base_url "$base_url" \
            --arg token "$token" \
            --arg email "$TEST_USER_EMAIL" \
            --arg phone "$phone" \
            '{
              name: "ci",
              values: [
                {key: "base_url",        value: $base_url,              enabled: true},
                {key: "token",           value: $token,                 enabled: true},
                {key: "invalid_token",   value: "invalid.ci.token",     enabled: true},
                {key: "test_first_name", value: "Regression",           enabled: true},
                {key: "test_last_name",  value: "Bot",                  enabled: true},
                {key: "test_phone",      value: $phone,                 enabled: true},
                {key: "test_email",      value: $email,                 enabled: true},
                {key: "test_lang",       value: "en",                   enabled: true}
              ]
            }' > "$RUNNER_TEMP/env.json"

      - name: Run Newman
        run: |
          mkdir -p results reports
          newman run collections/account-api-collection.json \
            -e "$RUNNER_TEMP/env.json" \
            -r cli,json,htmlextra \
            --reporter-json-export results/newman-report.json \
            --reporter-htmlextra-export reports/index.html \
            --reporter-htmlextra-title "Account API regression" \
            --reporter-htmlextra-browserTitle "Account API regression" \
            --reporter-htmlextra-skipHeaders "Authorization" \
            --reporter-htmlextra-skipEnvironmentVars \
            --reporter-htmlextra-skipGlobalVars

      # The repo and its Pages site are public: strip the token, Authorization headers,
      # API host and test-user email from the reports before they are uploaded.
      - name: Sanitize reports
        id: sanitize
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        run: |
          node scripts/sanitize-report.js "$RUNNER_TEMP/token" \
            results/newman-report.json reports/index.html

      - name: Upload JSON report
        if: always() && hashFiles('results/newman-report.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: newman-report
          path: results/newman-report.json
          retention-days: 7

      - name: Upload HTML report
        if: always() && hashFiles('reports/index.html') != ''
        uses: actions/upload-artifact@v5
        with:
          name: newman-html-report
          path: reports/index.html
          retention-days: 7

      # Published even when assertions fail, but only from main and only after sanitizing succeeded.
      - name: Prepare Pages site
        id: pages_site
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.sanitize.outcome != 'failure'
          && hashFiles('reports/index.html') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp reports/index.html "$RUNNER_TEMP/site/index.html"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: always() && steps.pages_site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/token" "$RUNNER_TEMP/env.json"

  deploy-report:
    name: Publish HTML report to GitHub Pages
    needs: newman
    # Runs when Newman failed assertions too; skipped if there is no sanitized report.
    if: always() && github.ref == 'refs/heads/main' && needs.newman.outputs.has_html_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
